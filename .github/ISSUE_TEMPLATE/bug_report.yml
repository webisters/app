name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        Security vulnerabilities do not belong in a public issue.
        Please follow SECURITY.md and email thewebisters@gmail.com.

  - type: checkboxes
    id: duplicate_search
    attributes:
      label: Duplicate search
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected behaviour
      description: Describe what you expected to happen.
      placeholder: Tell us what should have happened.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Run...
        2. Open...
        3. Observe...
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP version
      description: Run php --version to find your version.
      placeholder: PHP 8.2.0
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Package version
      description: Enter the affected Webisters package or application version.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error output
      description: Paste relevant error messages or logs.
      render: shell

  - type: textarea
    id: extra_context
    attributes:
      label: Extra context
      description: Add any other information that may help diagnose the problem.
